[project]
name = "civicbridge"
version = "0.1.0"
description = "Multilingual RAG assistant for public-service navigation — English, Bahasa Malaysia, Indonesian"
requires-python = ">=3.11"
# Contraintes SOUPLES ici, versions exactes dans uv.lock.
#
# Les versions etaient figees au pin exact de l'environnement Replit d'origine
# (faiss-cpu==1.10.0, streamlit==1.43.2...). Ces roues n'existent pas pour les
# versions recentes de Python : l'installation echouait des la premiere
# commande sur toute machine autre que celle du hackathon. Un depot de
# portfolio que personne ne peut installer ne sert a rien.
#
# On garde un plancher (les versions sur lesquelles le code a ete ecrit) et un
# plafond de majeure la ou l'API peut casser — langchain 0.3 -> 0.4 notamment.
dependencies = [
    "faiss-cpu>=1.10",
    "langchain>=0.3.21,<0.4",
    "langchain-community>=0.3.20,<0.4",
    "langchain-core>=0.3.51,<0.4",
    "langchain-openai>=0.3.9,<0.4",
    "langchain-text-splitters>=0.3.8,<0.4",
    "openai>=1.70",
    "pymupdf>=1.25.3",
    "python-dotenv>=1.1",
    "streamlit>=1.43",
    "tiktoken>=0.9",
]
